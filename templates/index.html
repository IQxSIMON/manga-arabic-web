<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101823">
  <title>قارئ ويب تون عربي</title>
  <link rel="stylesheet" href="/static/reader.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">ع</div>
      <div><h1>قارئ ويب تون عربي</h1><p>الصق رابط الفصل، واترك الباقي للموقع.</p></div>
    </header>
    <form id="chapterForm" class="link-panel">
      <label for="chapterUrl">رابط الفصل</label>
      <div class="url-row">
        <input id="chapterUrl" type="url" dir="ltr" autocomplete="url" required placeholder="https://example.com/.../chapter-1">
        <button id="translateBtn" type="submit">ترجمة الفصل</button>
      </div>
      <p class="hint">تبدأ المعالجة بمجرد لصق الرابط. ستظهر الصفحات بعد اكتمال ترجمتها ورسم العربية.</p>
    </form>
    <section class="sources-panel" aria-labelledby="sourcesTitle">
      <h2 id="sourcesTitle">المصادر المتوافقة</h2>
      <p class="hint">تظهر هنا المواقع التي يتوفر لها جلب مباشر للفصول الإنجليزية.</p>
      <div id="sourceList" class="source-list" aria-live="polite">جارٍ تحميل القائمة…</div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="pages" class="pages" aria-label="صفحات الفصل المترجمة"></section>
  </main>
  <script src="/static/reader.js" defer></script>
</body>
</html>
